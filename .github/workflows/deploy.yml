name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `next build` runs `generateStaticParams`, which calls the live ecommerce API to
      # enumerate every product/category. A network blip here yields fewer pages, so the
      # count is asserted to catch a silent partial deploy.
      - name: Build static site
        run: npm run build

      - name: Verify generated routes
        run: |
          products=$(find out/products -mindepth 2 -name index.html | wc -l)
          categories=$(find out/categories -mindepth 2 -name index.html | wc -l)
          echo "product pages: $products"
          echo "category pages: $categories"
          if [ "$products" -lt 10 ] || [ "$categories" -lt 3 ]; then
            echo "::error::static export looks incomplete"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4